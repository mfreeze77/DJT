name: Apply Russia-China-Iran targeting research update

on:
  push:
    branches:
      - agent/russia-china-iran-targeting

permissions:
  contents: write

jobs:
  apply-research-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source-controlled update
        run: python scripts/apply_russia_china_iran_targeting_update.py

      - name: Commit integrated research
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Current_Working_Tmanch_Conclusion.md Tmanch_CH7.md Tmanch_CH7_primary_sources.md Tmanch_CH7_claim_ledger.csv Tmanch_CH7_OFAC_license_matrix.csv
          git commit -m "research: integrate Russia-China-Iran targeting evidence [skip ci]"
          git push
