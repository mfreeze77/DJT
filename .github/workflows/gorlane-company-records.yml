name: Gorlane company-record follow-through
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/gorlane-company-records.yml']
permissions:
  contents: read
jobs:
  acquire:
    if: github.head_ref == 'research/gorlane-neighborhood-original-records-20261010' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Bounded public-record acquisition; no downloaded code execution
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, html.parser, json, os, pathlib, re, time, urllib.error, urllib.parse, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gorlane-company-records'
          root.mkdir(parents=True,exist_ok=True)
          (root/'code-head.txt').write_text(os.environ['REVIEW_HEAD'])
          rows=[];limited=set();seen=set()
          class SecureRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if urllib.parse.urlparse(newurl).scheme!='https':raise ValueError('Non-HTTPS redirect refused')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def get(name,url,limit=15000000,reason='explicit original-record target'):
              if url in seen:return None
              seen.add(url)
              item={'file':name,'requested_url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'review_status':'unreviewed','selection_reason':reason}
              host=urllib.parse.urlparse(url).hostname
              if host in limited:
                  item.update(status='not_obtained',error='Host previously returned429; stopped without bypass')
                  rows.append(item);return None
              data=None
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'DJT-public-record-review/1.0 (+https://github.com/mfreeze77/DJT)'})
                  with urllib.request.build_opener(SecureRedirect()).open(req,timeout=45) as response:
                      data=response.read(limit+1)
                      item.update(final_url=response.url,http_status=response.status,content_type=response.headers.get('Content-Type',''))
                  if len(data)>limit:raise ValueError('Size limit exceeded')
                  (root/name).write_bytes(data)
                  item.update(status='bytes_obtained_unreviewed',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  if name.endswith('.pdf') and b'%PDF-' not in data[:1024]:item['status']='unexpected_non_pdf_retained'
              except urllib.error.HTTPError as e:
                  item.update(status='not_obtained',error=str(e),http_status=e.code)
                  if e.code==429:limited.add(host)
              except Exception as e:item.update(status='not_obtained',error=str(e))
              rows.append(item)
              (root/'acquisition.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
              print(name,item['status'],item.get('bytes',''),item.get('error',''))
              time.sleep(1)
              return data
          class RowLinks(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.inside=False;self.text=[];self.links=[];self.rows=[]
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if tag=='tr':self.inside=True;self.text=[];self.links=[]
                  if self.inside and tag=='a' and attrs.get('href'):self.links.append(attrs['href'])
              def handle_data(self,data):
                  if self.inside:self.text.append(data)
              def handle_endtag(self,tag):
                  if tag=='tr' and self.inside:self.rows.append((' '.join(' '.join(self.text).split()),self.links));self.inside=False
          base='https://find-and-update.company-information.service.gov.uk/company/05188128'
          filing_index=[];selected=[]
          for page in range(1,5):
              url=base+'/filing-history'+(f'?page={page}' if page>1 else '')
              data=get(f'global-steel-filings-{page}.html',url,5000000,'All four visible filing-history pages; selection by filing type/year, not inferred contents')
              if not data:continue
              parser=RowLinks();parser.feed(data.decode('utf-8',errors='replace'))
              for desc,links in parser.rows:
                  pdfs=[urllib.parse.urljoin(base,u) for u in links if '/document' in u]
                  for u in pdfs:
                      if urllib.parse.urlparse(u).hostname!='find-and-update.company-information.service.gov.uk':continue
                      if not urllib.parse.urlparse(u).path.startswith('/company/05188128/filing-history/'):continue
                      filing_index.append({'description':desc,'url':u,'index_page':page})
                      annual=('Annual return' in desc and re.search(r'23 July 200[7-9]|23 July 201[0-3]',desc))
                      accounts=('Accounts for a dormant company' in desc and re.search(r'31 July 20(?:09|10|11|12|13)',desc))
                      officers=('Termination' in desc and re.search(r'Alexander Shnaider|Edward Chifrin',desc))
                      confirmation=('Confirmation statement' in desc and '23 July 2022' in desc)
                      if annual or accounts or officers or confirmation:selected.append((u,desc))
          (root/'global-steel-filing-selection.json').write_text(json.dumps({'all_index_rows':filing_index,'selected':selected,'maximum_documents':24},indent=2))
          for i,(url,desc) in enumerate(selected[:24],1):get(f'global-steel-document-{i:02d}.pdf',url,15000000,desc)
          get('global-steel-charges.html',base+'/charges',5000000,'Check public charge register; an empty page is not worldwide no-security proof')
          get('ukraine-decree-275-2023.html','https://www.president.gov.ua/documents/2752023-46741',5000000)
          get('ukraine-decree-275-annex2.pdf','https://www.president.gov.ua/storage/j-files-storage/01/18/65/05b2f86c666546a33fd5c5d6f9feca47_1683901354.pdf',5000000,'Registration-number leads in original government annex; sanctions are not credit advances')
          get('icij-rest-openapi.json','https://offshoreleaks.icij.org/api/v1/rest/openapi',5000000,'Schema route linked by acquired publisher schema page; do not call private endpoints')
          get('cyprus-public-search.html','https://efiling.drcor.mcit.gov.cy/DrcorPublic/default.aspx',5000000,'Public entry point only; no purchase or authenticated access')
          get('irs-2017-1120s-instructions.pdf','https://www.irs.gov/pub/irs-prior/i1120s--2017.pdf',5000000,'Historical amendment/QSub reporting instructions; not taxpayer election acceptance')
          get('irs-2017-form-8869.pdf','https://www.irs.gov/pub/irs-prior/f8869--2017.pdf',5000000)
          # One low-reliability discovery page is used only to recover its exact primary court links.
          url='https://kartoteka.news/news/66428-chuvalov_zakryvaet_scheta'
          data=get('russian-docket-link-discovery.html',url,5000000,'Unverified reporting; not a promoted financial finding')
          if data:
              class Links(html.parser.HTMLParser):
                  def __init__(self):super().__init__();self.urls=[]
                  def handle_starttag(self,tag,attrs):
                      a=dict(attrs)
                      if tag=='a' and a.get('href'):self.urls.append(urllib.parse.urljoin(url,a['href']))
              parser=Links();parser.feed(data.decode('utf-8',errors='replace'))
              links=list(dict.fromkeys(u for u in parser.urls if urllib.parse.urlparse(u).hostname in {'kad.arbitr.ru','ras.arbitr.ru'} and urllib.parse.urlparse(u).scheme=='https'))[:6]
              (root/'primary-court-links.json').write_text(json.dumps(links,indent=2))
              for i,u in enumerate(links,1):get(f'russian-primary-court-{i}.html',u,10000000,'Exact primary court link from discovery article; inspect response before calling it a judgment')
          (root/'README.txt').write_text('Branch-scoped public acquisitions. Previously recovered raw ICIJ, Talon 6.pdf and PR27 tax artifacts are reused, NOT downloaded by this workflow. No source is executed. TLS verification remains enabled. All responses initially unreviewed; a successful HTTP response may be an access page. No purchases, outreach, private banking, confidential SARs, or permission/rate-limit bypass.\n')
          PY
      - name: Preserve temporary source bytes and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gorlane-company-records
          path: ${{ runner.temp }}/gorlane-company-records/
          compression-level: 0
          retention-days: 3
