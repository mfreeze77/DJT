name: Quinira continuation artifact recovery
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/quinira-recovery-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.run_number == 1 && github.event.pull_request.number == 29 && github.head_ref == 'research/gorlane-financing-quinira-20261011' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve current tree and four already obtained source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,os,subprocess,urllib.request,urllib.parse,json,hashlib,datetime
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'quinira-recovery';root.mkdir()
          subprocess.run(['git','bundle','create',str(root/'repository.bundle'),'--all'],check=True)
          (root/'head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if urllib.parse.urlparse(newurl).scheme!='https':raise ValueError('Non-HTTPS redirect refused')
                  out=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if urllib.parse.urlparse(newurl).hostname!=urllib.parse.urlparse(req.full_url).hostname:out.remove_header('Authorization')
                  return out
          opener=urllib.request.build_opener(SafeRedirect())
          def get(url):
              headers={'User-Agent':'DJT-evidence-artifact-recovery'}
              if urllib.parse.urlparse(url).hostname=='api.github.com':headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              with opener.open(urllib.request.Request(url,headers=headers),timeout=40) as r:b=r.read(20000001)
              if len(b)>20000000:raise ValueError('Size cap')
              return b
          rows=[]
          for name in ['quinira-session-final','quinira-public-search','quinira-court-schema','quinira-docket-image']:
              url='https://api.github.com/repos/mfreeze77/DJT/actions/artifacts?per_page=100&name='+name
              candidates=json.loads(get(url)).get('artifacts',[])
              candidates=[a for a in candidates if not a['expired'] and a['name']==name and a.get('workflow_run',{}).get('head_branch')=='research/gorlane-financing-quinira-20261011']
              if not candidates:rows.append({'name':name,'status':'not_available'});continue
              a=max(candidates,key=lambda a:a['id']);b=get(a['archive_download_url']);digest=hashlib.sha256(b).hexdigest()
              if a.get('digest')!='sha256:'+digest:raise ValueError('Artifact digest mismatch: '+name)
              (root/(name+'.zip')).write_bytes(b)
              rows.append({'name':name,'status':'recovered_prior_artifact','artifact':a,'sha256':digest,'bytes':len(b),'recovered_at':datetime.datetime.now(datetime.timezone.utc).isoformat()})
          (root/'recovery.json').write_text(json.dumps(rows,indent=2))
          print([(r['name'],r['status']) for r in rows])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quinira-continuation-recovery
          path: ${{ runner.temp }}/quinira-recovery/
          retention-days: 7
