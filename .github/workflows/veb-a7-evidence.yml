name: VEB-A7 evidence integrity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/veb_a7_2026/**'
      - 'Tmanch_Russian_Linked_Financial_Flows.csv'
      - 'trump-russia-timeline/data/processed/by-year/2010.json'
      - 'trump-russia-timeline/data/processed/by-year/2011.json'
      - '.github/workflows/veb-a7-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'research/veb_a7_2026/**'
      - 'Tmanch_Russian_Linked_Financial_Flows.csv'
      - 'trump-russia-timeline/data/processed/by-year/2010.json'
      - 'trump-russia-timeline/data/processed/by-year/2011.json'
      - '.github/workflows/veb-a7-evidence.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate repository evidence structure
        run: node research/veb_a7_2026/validate_evidence.mjs
      - name: Validate follow-up references and accounting
        run: |
          node research/veb_a7_2026/validate_followup.mjs
          node research/veb_a7_2026/validate_accounting.mjs
          node research/veb_a7_2026/audit_rinfo.mjs
      - name: Validate corpus and tax metadata
        run: node research/veb_a7_2026/validate_corpus_tax.mjs
      - name: Test rejection of invalid evidence metadata
        run: node --test research/veb_a7_2026/validate_evidence.test.mjs research/veb_a7_2026/review_assessment.test.mjs
      - name: Test committed Gorlane interpretation and synthetic selection only
        run: |
          node --test research/veb_a7_2026/gorlane_review.test.mjs
          python3 -B research/veb_a7_2026/test_gorlane_neighborhood.py
        # No raw export is downloaded or present here. This step is not raw-byte parity.
      - name: Check incorporated Panama Papers findings against committed rows
        run: node --test research/veb_a7_2026/panama_papers_findings.test.mjs
      - name: Confirm validation did not modify tracked files
        run: git diff --exit-code
