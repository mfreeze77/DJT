name: Publish exact Gorlane delivery once
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/gorlane-publication/**'
      - '.github/workflows/gorlane-publication.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: gorlane-pr28-delivery-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.pull_request.number == 28 && github.head_ref == 'research/gorlane-neighborhood-original-records-20261010' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned rendering tools in isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/gorlane-publish-venv"
          "$RUNNER_TEMP/gorlane-publish-venv/bin/pip" install PyMuPDF==1.26.7 Pillow==12.3.0
      - name: Verify exact delivery and publish only the authorized research branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/gorlane-publish-venv/bin/python" .github/gorlane-publication/publish.py'
