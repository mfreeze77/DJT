name: Publish reviewed Quinira research once
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/quinira-transfer/**'
      - '.github/workflows/quinira-publish-once.yml'
permissions:
  contents: write
concurrency:
  group: quinira-pr29-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.run_number == 1 && github.event.pull_request.number == 29 && github.head_ref == 'research/gorlane-financing-quinira-20261011' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact reviewed patch, run complete checks, and publish only PR29 branch
        run: python3 -B .github/quinira-transfer/publish.py
