name: Apply Manafort-Kilimnik operational-use research update

on:
  push:
    branches:
      - agent/manafort-kilimnik-operational-use
    paths:
      - scripts/apply_manafort_kilimnik_operational_use_update.py
      - .github/workflows/apply-manafort-kilimnik-operational-use.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/manafort-kilimnik-operational-use
          fetch-depth: 0

      - name: Apply research update
        run: python3 scripts/apply_manafort_kilimnik_operational_use_update.py

      - name: Commit generated research changes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tmanch_CH5.md Tmanch_CH5_support.md Tmanch_CH5_counterevidence.md Tmanch_CH5_open_questions.md Tmanch_CH5_claim_ledger.csv Current_Working_Tmanch_Conclusion.md README.md
          git commit -m "research: strengthen Manafort-Kilimnik operational-use assessment [skip ci]"
          git push origin HEAD:agent/manafort-kilimnik-operational-use
