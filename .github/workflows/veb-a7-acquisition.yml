name: VEB-A7 follow-up acquisition
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/veb-a7-acquisition.yml'
permissions:
  contents: read
jobs:
  acquire:
    if: github.head_ref == 'research/veb-a7-corpus-tax'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check reviewed tree without changing tracked files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/veb-corpus-court"
          mkdir -p "$out"
          node research/veb_a7_2026/validate_evidence.mjs > "$out/validation.txt"
          node --test research/veb_a7_2026/validate_evidence.test.mjs > "$out/tests.txt"
          git diff --exit-code
          git rev-parse HEAD > "$out/checkout.txt"
      - name: Acquire identified public court pages without executing downloads
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, pathlib, urllib.parse, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'veb-corpus-court'
          class HTTPSOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if urllib.parse.urlparse(newurl).scheme!='https': raise ValueError('Non-HTTPS redirect refused')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def get(item):
              name,url=item
              row=dict(file=name,url=url,retrieved_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 public-record-research'})
                  with urllib.request.build_opener(HTTPSOnly()).open(req,timeout=90) as r:
                      data=r.read(12000001)
                      if len(data)>12000000: raise ValueError('12MB limit')
                      row.update(final_url=r.url,content_type=r.headers.get('Content-Type',''))
                  (root/name).write_bytes(data)
                  row.update(status='bytes_obtained_unreviewed',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
              except Exception as e:row.update(status='not_retrieved',error=str(e))
              return row
          targets=[
            ('avonwick-2020.html','https://caselaw.nationalarchives.gov.uk/ewhc/comm/2020/1844'),
            ('appeal-2021-index.html','https://www.judiciary.uk/judgments/avonwick-holdings-limited-v-azitio-holdings-limited-ors/'),
            ('ukraine-ruling-reproduction.html','https://youcontrol.com.ua/en/catalog/court-document/110589321/'),
            ('icij-gorlane.html','https://offshoreleaks.icij.org/nodes/10210594'),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:rows=list(pool.map(get,targets))
          (root/'acquisition.json').write_text(json.dumps(rows,indent=2))
          for row in rows:print(row['file'],row['status'],row.get('bytes',''),row.get('error',''))
          PY
      - name: Save temporary review artifact, not source files in repository
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veb-corpus-court
          path: ${{ runner.temp }}/veb-corpus-court/
          retention-days: 1
