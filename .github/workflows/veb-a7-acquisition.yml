name: VEB-A7 follow-up acquisition
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/veb-a7-acquisition.yml'
permissions:
  contents: read
jobs:
  acquire:
    if: github.head_ref == 'research/veb-a7-original-records-followup'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Re-run existing structural controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/veb-a7-acquisition"
          node research/veb_a7_2026/validate_evidence.mjs | tee "$RUNNER_TEMP/veb-a7-acquisition/validation.txt"
          node --test research/veb_a7_2026/validate_evidence.test.mjs | tee "$RUNNER_TEMP/veb-a7-acquisition/tests.txt"
          git diff --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/veb-a7-acquisition/checkout-commit.txt"
      - name: Obtain already-public documents without executing downloaded content
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, html.parser, json, os, pathlib, urllib.parse, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'veb-a7-acquisition'
          rows = []
          class HTTPSOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urllib.parse.urlparse(newurl).scheme != 'https':
                      raise ValueError('Refusing non-HTTPS redirect')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          def get(item):
              name, url = item
              row = dict(file=name, url=url, retrieved_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
              try:
                  opener = urllib.request.build_opener(HTTPSOnly())
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 public-record-research'})
                  with opener.open(req, timeout=75) as response:
                      data = response.read(30000001)
                      if len(data) > 30000000: raise ValueError('Size limit exceeded')
                      row.update(final_url=response.url, content_type=response.headers.get('Content-Type',''), size=len(data))
                  (out / name).write_bytes(data)
                  row.update(status='bytes_obtained_unreviewed', sha256=hashlib.sha256(data).hexdigest())
              except Exception as error:
                  row.update(status='not_retrieved', error=str(error))
              return row
          targets = [
              ('a7-disclosure-index.html', 'https://www.e-disclosure.ru/portal/files.aspx?id=39813&type=4'),
              ('luxe-midland-judgment.pdf', 'https://7kbw.co.uk/wp-content/uploads/2016/06/Luxe_v_Midland_Resources-1.pdf'),
              ('cir-a7-abroad.pdf', 'https://www.info-res.org/app/uploads/2025/10/A7-Abroad-FINAL-Copy.pdf'),
              ('a7-presentation-2026.pdf', 'https://invest-wm-wmback-wm-finance-issuance.t-static.ru/01a0f837-f31f-76b9-8b57-fb9e1500fd7e'),
              ('aragon-2025-financials.pdf', 'https://aragonsk.ru/zed/files/121_125.pdf'),
              ('fincen-2026-20371.pdf', 'https://www.govinfo.gov/content/pkg/FR-2026-10-05/pdf/2026-20371.pdf'),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              rows.extend(pool.map(get, targets))
          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href', '')
                      if 'fileload' in href.lower(): self.links.append(href)
          index = out / 'a7-disclosure-index.html'
          if index.exists():
              parser = Links(); parser.feed(index.read_bytes().decode('utf-8', errors='replace'))
              links = list(dict.fromkeys(parser.links))[:6]
              resolved = [urllib.parse.urljoin(targets[0][1], href) for href in links]
              (out / 'a7-disclosure-links.json').write_text(json.dumps(resolved, indent=2))
              for i, url in enumerate(resolved, 1):
                  if urllib.parse.urlparse(url).scheme == 'https' and urllib.parse.urlparse(url).hostname in {'e-disclosure.ru','www.e-disclosure.ru'}:
                      rows.append(get((f'a7-disclosure-{i}.bin', url)))
          (out / 'manifest.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2))
          for row in rows: print(row['file'], row['status'], row.get('sha256',''), row.get('error',''))
          PY
      - name: Save one-day review artifact; source bytes are not committed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veb-a7-original-records-wave2
          path: ${{ runner.temp }}/veb-a7-acquisition/
          retention-days: 1
          if-no-files-found: error
