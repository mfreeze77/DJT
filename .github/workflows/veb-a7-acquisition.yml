name: VEB-A7 follow-up acquisition
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/veb-a7-acquisition.yml'
permissions:
  contents: read
jobs:
  acquire:
    if: github.head_ref == 'research/veb-a7-accounting-settlement'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate current checkout and save reproducible baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/veb-a7-acquisition"
          node research/veb_a7_2026/validate_evidence.mjs | tee "$RUNNER_TEMP/veb-a7-acquisition/validation.txt"
          node --test research/veb_a7_2026/validate_evidence.test.mjs | tee "$RUNNER_TEMP/veb-a7-acquisition/tests.txt"
          node research/veb_a7_2026/validate_followup.mjs | tee "$RUNNER_TEMP/veb-a7-acquisition/followup.txt"
          node research/veb_a7_2026/audit_rinfo.mjs > "$RUNNER_TEMP/veb-a7-acquisition/rinfo.json"
          git diff --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/veb-a7-acquisition/checkout-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/veb-a7-acquisition/repository.tar.gz"
      - name: Acquire bounded public documents without executing them
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, pathlib, urllib.parse, urllib.request
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'veb-a7-acquisition'
          class HTTPSOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urllib.parse.urlparse(newurl).scheme != 'https':
                      raise ValueError('Refusing non-HTTPS redirect')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          def get(item):
              name, raw_url = item
              url = urllib.parse.quote(raw_url, safe=':/?=&%')
              row = dict(file=name, url=url, retrieved_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 public-record-research'})
                  with urllib.request.build_opener(HTTPSOnly()).open(req, timeout=90) as response:
                      data = response.read(40000001)
                      if len(data) > 40000000: raise ValueError('Size limit exceeded')
                      row.update(final_url=response.url, content_type=response.headers.get('Content-Type',''), size=len(data))
                  if name.endswith('.pdf') and not data.startswith(b'%PDF-'):
                      raise ValueError('Response is not PDF; no purported source retained')
                  (out / name).write_bytes(data)
                  row.update(status='bytes_obtained_unreviewed', sha256=hashlib.sha256(data).hexdigest())
              except Exception as error:
                  row.update(status='not_retrieved', error=str(error))
              return row
          targets = [
              ('trump-2016-disclosure.pdf', 'https://assets.documentcloud.org/documents/2838696/Trump-2016-Financial-Disclosure.pdf'),
              ('trump-2017-disclosure.pdf', 'https://assets.documentcloud.org/documents/3867971/Trump-2016-Financial-Disclosures.pdf'),
              ('oge-2018-public-page.html', 'https://oge.box.com/v/Trump2018Annual278'),
              ('oge-2017-public-page.html', 'https://oge.box.com/s/kz4qvbdsbcfrzq16msuo4zmth6rerh1c'),
              ('oge-index.html', 'https://extapps2.oge.gov/201/Presiden.nsf/President%20and%20Vice%20President%20Index'),
              ('aragon-index.html', 'https://aragonsk.ru/'),
              ('a7-index.html', 'https://www.a7.ru/'),
              ('frankmedia-207431.html', 'https://frankmedia.ru/207431'),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              rows = list(pool.map(get, targets))
          (out / 'manifest.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2))
          for row in rows: print(row['file'], row['status'], row.get('sha256',''), row.get('error',''))
          PY
      - name: Save one-day review artifact; no source PDFs committed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veb-a7-accounting-disclosures
          path: ${{ runner.temp }}/veb-a7-acquisition/
          retention-days: 1
          if-no-files-found: error
