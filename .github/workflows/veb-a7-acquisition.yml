name: VEB-A7 follow-up acquisition
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/veb-a7-acquisition.yml'
permissions:
  contents: read
jobs:
  acquire:
    if: github.head_ref == 'research/veb-a7-corpus-tax'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate the exact checkout
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/veb-tax-split"
          mkdir -p "$out/index" "$out/A" "$out/B" "$out/C" "$out/D"
          node research/veb_a7_2026/validate_evidence.mjs > "$out/index/validation.txt"
          node --test research/veb_a7_2026/validate_evidence.test.mjs > "$out/index/tests.txt"
          node research/veb_a7_2026/validate_followup.mjs > "$out/index/followup.txt"
          node research/veb_a7_2026/validate_accounting.mjs > "$out/index/accounting.txt"
          node research/veb_a7_2026/audit_rinfo.mjs > "$out/index/rinfo-integrity.json"
          git diff --exit-code
          git rev-parse HEAD > "$out/index/checkout.txt"
      - name: Acquire public mirror files with HTTPS and per-file limits
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, html.parser, json, os, pathlib, re, urllib.parse, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'veb-tax-split'
          class HTTPSOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if urllib.parse.urlparse(newurl).scheme!='https': raise ValueError('Non-HTTPS redirect refused')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          def get(item):
              rel,url=item; dest=root/rel; tmp=dest.with_suffix('.partial')
              row=dict(file=rel,url=url,retrieved_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 public-record-research'})
                  h=hashlib.sha256(); size=0
                  with urllib.request.build_opener(HTTPSOnly()).open(req,timeout=120) as r,tmp.open('wb') as out:
                      row.update(final_url=r.url,content_type=r.headers.get('Content-Type',''))
                      while True:
                          b=r.read(1048576)
                          if not b: break
                          size+=len(b)
                          if size>200000000: raise ValueError('200MB file limit')
                          h.update(b);out.write(b)
                  if dest.suffix=='.pdf':
                      with tmp.open('rb') as f:
                          if f.read(5)!=b'%PDF-': raise ValueError('Not PDF')
                  tmp.replace(dest);row.update(status='bytes_obtained_unreviewed',bytes=size,sha256=h.hexdigest())
              except Exception as e:
                  tmp.unlink(missing_ok=True);row.update(status='not_retrieved',error=str(e))
              return row
          url='https://www.citizensforethics.org/reports-investigations/crew-reports/trumps-tax-returns/'
          rows=[get(('index/crew.html',url))]
          class Links(html.parser.HTMLParser):
              def __init__(self): super().__init__();self.urls=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      v=urllib.parse.urljoin(url,dict(attrs).get('href',''))
                      if urllib.parse.urlparse(v).path.lower().endswith('.pdf'): self.urls.append(v)
          parser=Links();parser.feed((root/'index/crew.html').read_text(errors='replace'))
          urls=list(dict.fromkeys(parser.urls))[:60];targets=[]
          for i,u in enumerate(urls,1):
              if urllib.parse.urlparse(u).hostname not in {'www.citizensforethics.org','citizensforethics.org','s3.documentcloud.org'}: continue
              group='A' if i<=9 else 'B' if i<=22 else 'C' if i<=36 else 'D'
              name=re.sub(r'[^A-Za-z0-9_.-]','_',urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit('/',1)[-1]))
              targets.append((f'{group}/{i:02d}-{name}',u))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: rows.extend(pool.map(get,targets))
          (root/'index/acquisition.json').write_text(json.dumps(rows,indent=2))
          for row in rows: print(row['file'],row['status'],row.get('bytes',''),row.get('error',''))
          PY
      - name: Save split manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veb-tax-split-index
          path: ${{ runner.temp }}/veb-tax-split/index/
          retention-days: 1
      - name: Save tax group A
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veb-tax-A
          path: ${{ runner.temp }}/veb-tax-split/A/
          compression-level: 0
          retention-days: 1
      - name: Save tax group B
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veb-tax-B
          path: ${{ runner.temp }}/veb-tax-split/B/
          compression-level: 0
          retention-days: 1
      - name: Save tax group C
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veb-tax-C
          path: ${{ runner.temp }}/veb-tax-split/C/
          compression-level: 0
          retention-days: 1
      - name: Save tax group D
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veb-tax-D
          path: ${{ runner.temp }}/veb-tax-split/D/
          compression-level: 0
          retention-days: 1
