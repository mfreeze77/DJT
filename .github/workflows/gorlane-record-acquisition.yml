name: Gorlane original-record acquisition
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/gorlane-record-acquisition.yml'
permissions:
  contents: read
jobs:
  acquire:
    if: github.head_ref == 'research/gorlane-neighborhood-original-records-20261010' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Preserve exact checkout and run complete reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gorlane-opening"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/acquisition-code-commit.txt"
          git bundle create "$out/repository.bundle" HEAD
          git worktree add --detach "$RUNNER_TEMP/gorlane-baseline" 4d90dbca4b6f7ad99676b7eb8c36d43b415af178
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'gorlane-opening'
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'gorlane-baseline'
          def git(*args):
              return subprocess.check_output(['git',*args],cwd=base,text=True).strip()
          def tracked():
              paths=subprocess.check_output(['git','ls-files','-z'],cwd=base).decode().split('\0')
              return {p:hashlib.sha256((base/p).read_bytes()).hexdigest() for p in paths if p}
          before=tracked()
          commands=[['node',f'research/veb_a7_2026/{x}'] for x in ['validate_evidence.mjs','validate_followup.mjs','validate_accounting.mjs','validate_corpus_tax.mjs','audit_rinfo.mjs']]
          commands.append(['node','--test','research/veb_a7_2026/validate_evidence.test.mjs','research/veb_a7_2026/review_assessment.test.mjs'])
          results=[]
          for i,command in enumerate(commands,1):
              result=subprocess.run(command,cwd=base,capture_output=True,text=True)
              filename=f'baseline-check-{i}.txt'
              (out/filename).write_text(result.stdout+'\nSTDERR\n'+result.stderr)
              results.append({'command':command,'exit_code':result.returncode,'log':filename})
              print('CHECK',i,'EXIT',result.returncode,command)
              if i==6:print(result.stdout[-2000:])
          after=tracked()
          status=git('status','--porcelain','--untracked-files=no')
          report={'checked_commit':git('rev-parse','HEAD'),'node_version':subprocess.check_output(['node','--version'],text=True).strip(),'completed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'commands':results,'tracked_file_hashes_before':before,'tracked_files_unchanged':before==after,'tracked_status_after':status,'instruction_paths':[p for p in before if pathlib.Path(p).name in ('AGENTS.md','CLAUDE.md')],'meaning':'Structural checks only; not historical authentication. Exact baseline, not a synthetic PR merge.'}
          (out/'baseline-validation.json').write_text(json.dumps(report,indent=2))
          assert before==after and not status,'read-only baseline checks changed tracked files'
          assert all(r['exit_code']==0 for r in results),'baseline validation failed'
          PY
      - name: Obtain bounded public evidence without executing downloads
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, time, urllib.error, urllib.parse, urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'gorlane-opening'
          evidence=root/'acquired'
          evidence.mkdir(parents=True,exist_ok=True)
          class HTTPSOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if urllib.parse.urlparse(newurl).scheme!='https':raise ValueError('Non-HTTPS redirect refused')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          targets=[
            ('full-oldb.acquired-20261010.zip','https://offshoreleaks-data.icij.org/offshoreleaks/csv/full-oldb.LATEST.zip',100000000),
            ('icij-database.html','https://offshoreleaks.icij.org/pages/database',3000000),
            ('icij-data.html','https://offshoreleaks.icij.org/pages/data',3000000),
            ('icij-reconciliation.html','https://offshoreleaks.icij.org/docs/reconciliation',3000000),
            ('icij-rest-schema.html','https://offshoreleaks.icij.org/schema/oldb',5000000),
            ('avonwick-2020.pdf','https://www.judiciary.uk/wp-content/uploads/2020/07/avonwick.judgment.14.7.2020handdownfinal.pdf',15000000),
            ('avonwick-2020.html','https://caselaw.nationalarchives.gov.uk/ewhc/comm/2020/1844',5000000),
            ('dargamo-2021-bailii.html','https://www.bailii.org/ew/cases/EWCA/Civ/2021/1149.html',5000000),
            ('appeal-2021-index.html','https://www.judiciary.uk/judgments/avonwick-holdings-limited-v-azitio-holdings-limited-ors/',3000000),
            ('ukraine-110589321-original.html','https://reyestr.court.gov.ua/Review/110589321',5000000),
            ('ukraine-110589321-reproduction.html','https://youcontrol.com.ua/catalog/court-document/110589321/',5000000),
            ('talon-index.html','https://cfcanada.fticonsulting.com/talon/',5000000),
            ('talon-wolf-6.pdf','https://cfcanada.fticonsulting.com/talon/docs/6.pdf',65000000),
            ('toronto-buyout-announcement.html','https://www.newswire.ca/news-releases/jcf-capital-and-trump-hotels-announce-management-contract-buy-out-631070103.html',5000000),
          ]
          node_ids=['10210594','12155628','10088926','12141123','12159818','12163340','12167368','12205452','12121184','12146270','12099846','12133896','10173628','20025856','11003807']
          targets.extend((f'icij-node-{n}.html',f'https://offshoreleaks.icij.org/nodes/{n}',10000000) for n in node_ids)
          rows=[]
          rate_limited=set()
          for filename,url,limit in targets:
              host=urllib.parse.urlparse(url).hostname
              row={'file':filename,'requested_url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'review_status':'unreviewed','reacquisition':True}
              if host in rate_limited:
                  row.update(status='not_attempted_after_rate_limit',error='Earlier HTTP429 on this host; no bypass or retry')
                  rows.append(row)
                  continue
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'DJT-public-record-review/1.0 (+https://github.com/mfreeze77/DJT)'})
                  with urllib.request.build_opener(HTTPSOnly()).open(request,timeout=75) as response:
                      data=response.read(limit+1)
                      row.update(final_url=response.url,http_status=response.status,content_type=response.headers.get('Content-Type',''))
                  if len(data)>limit:raise ValueError(f'Response exceeds {limit}-byte limit')
                  (evidence/filename).write_bytes(data)
                  row.update(status='bytes_obtained_unreviewed',bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  if filename.endswith('.pdf') and b'%PDF-' not in data[:1024]:row['status']='unexpected_non_pdf_response_retained'
                  if filename.endswith('.zip'):
                      row['expected_baseline_sha256']='9e5faeed998b5715157bbdb2a600681d1b5bda259ba004c998b3b2836d3c49aa'
                      row['matches_baseline_archive']=row['sha256']==row['expected_baseline_sha256']
                      if not data.startswith(b'PK'):row['status']='unexpected_non_zip_response_retained'
              except urllib.error.HTTPError as error:
                  row.update(status='not_obtained',http_status=error.code,error=str(error))
                  if error.code==429:rate_limited.add(host)
              except Exception as error:
                  row.update(status='not_obtained',error=str(error))
              rows.append(row)
              print(filename,row['status'],row.get('bytes',''),row.get('error',''))
              (root/'acquisition.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
              time.sleep(1)
          (root/'ACQUISITION-README.txt').write_text('Public-source reacquisitions, not new authentication. Every obtained response is initially unreviewed. Baseline CSV ZIP and member hashes require explicit parity verification. The raw ICIJ data is attributed to the International Consortium of Investigative Journalists, ODbL database / CC BY-SA contents per publisher. Do not commit unnecessary personal addresses or taxpayer identifiers. PDF image/native-text review and final validation are separate later steps. No downloaded material was executed.\n')
          PY
      - name: Save temporary evidence and exact repository bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gorlane-opening-records
          path: ${{ runner.temp }}/gorlane-opening/
          compression-level: 0
          retention-days: 3
