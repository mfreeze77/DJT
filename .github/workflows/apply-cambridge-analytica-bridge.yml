name: Apply Cambridge Analytica bridge research update

on:
  push:
    branches:
      - agent/cambridge-analytica-bridge
    paths:
      - scripts/apply_cambridge_analytica_bridge_update.py
      - .github/workflows/apply-cambridge-analytica-bridge.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cambridge-analytica-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply research update
        run: python scripts/apply_cambridge_analytica_bridge_update.py
      - name: Commit integrated research
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Current_Working_Tmanch_Conclusion.md Tmanch_CH5.md Tmanch_CH5_support.md Tmanch_CH5_counterevidence.md Tmanch_CH5_open_questions.md Tmanch_CH5_primary_sources.md Tmanch_CH5_claim_ledger.csv
          git commit -m "research: integrate Cambridge Analytica data-bridge analysis [skip ci]"
          git push origin HEAD:agent/cambridge-analytica-bridge
