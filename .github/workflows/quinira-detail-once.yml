name: Quinira free company details
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/quinira-detail-once.yml']
permissions:
  contents: read
jobs:
  acquire:
    if: github.run_number == 1 && github.head_ref == 'research/gorlane-financing-quinira-20261011' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Select only the five exact public results; no account or purchase
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,time,urllib.request,urllib.parse,urllib.error,http.cookiejar
          from html.parser import HTMLParser
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'quinira-details';root.mkdir()
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.fields={};self.links=[];self.action=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='form':self.action=a.get('action')
                  if tag=='input' and a.get('name') and (a.get('type','').lower()=='hidden' or a.get('type','').lower()=='text' or a.get('type','').lower()=='radio' and 'checked' in a):self.fields[a['name']]=a.get('value','')
                  if tag=='a' and a.get('href'):self.links.append(a['href'])
          class SecureRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if urllib.parse.urlparse(newurl).scheme!='https':raise ValueError('Non-HTTPS redirect refused')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SecureRedirect(),urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          rows=[];blocked=False
          def get(name,url,data=None):
              global blocked
              row={'file':name,'requested_url':url,'method':'POST-public-select' if data else 'GET','retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'review_status':'unreviewed'}
              try:
                  req=urllib.request.Request(url,data=data,headers={'User-Agent':'DJT-public-record-review/1.0 (+https://github.com/mfreeze77/DJT)'})
                  with opener.open(req,timeout=35) as r:b=r.read(4000001);row.update(final_url=r.url,http_status=r.status,content_type=r.headers.get('Content-Type',''))
                  if len(b)>4000000:raise ValueError('Size limit')
                  (root/name).write_bytes(b);row.update(status='bytes_obtained_unreviewed',bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                  if any(x in b.lower() for x in [b'g-recaptcha',b'hcaptcha',b'cf-chl-']):blocked=True;row['status']='access_challenge_retained'
                  rows.append(row);time.sleep(2);return b,r.url
              except Exception as e:row.update(status='not_obtained',error=str(e));blocked=True
              rows.append(row);return None,url
          records=[]
          for name,number in [('belego','251868'),('sileni','251695'),('equalchance','187745'),('quinira','286910'),('freegain','286456')]:
              if blocked:break
              u='https://efiling.drcor.mcit.gov.cy/DrcorPublic/SearchResults.aspx?name=%25&number='+number+'&searchtype=optStartMatch&index=1&tname=%25&sc=0'
              b,u=get(name+'-result.html',u)
              if not b or blocked:break
              p=Parser();p.feed(b.decode('utf-8','replace'))
              if not any("GridView1','Select$0" in x for x in p.links):records.append({'company':name,'status':'expected_public_selection_absent'});continue
              target=urllib.parse.urljoin(u,p.action)
              if urllib.parse.urlparse(target).hostname!='efiling.drcor.mcit.gov.cy':raise ValueError('unexpected host')
              fields=p.fields|{'__EVENTTARGET':'ctl00$cphMyMasterCentral$GridView1','__EVENTARGUMENT':'Select$0'}
              b,u=get(name+'-details.html',target,urllib.parse.urlencode(fields).encode())
              if b:
                  p=Parser();p.feed(b.decode('utf-8','replace'));records.append({'company':name,'number':number,'final_url':u,'links':p.links,'status':'details_response_pending_review'})
              (root/'acquisition.json').write_text(json.dumps(rows,indent=2))
          (root/'detail-links.json').write_text(json.dumps(records,indent=2));(root/'acquisition.json').write_text(json.dumps(rows,indent=2))
          print([(x['file'],x['status']) for x in rows])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quinira-details
          path: ${{ runner.temp }}/quinira-details/
          retention-days: 7
